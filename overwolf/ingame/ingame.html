<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoachBuild Overlay</title>
    <link rel="stylesheet" href="ingame.css" />
  </head>
  <body>
    <!--
      Single-monitor revision (2026-07-27): this window is the ONLY surface,
      so it now owns its own lane control (writes back to the same
      localStorage key the desktop window uses) instead of assuming a second
      screen picked the lane already. See overwolf/js/skillOrderData.js and
      ingame.js headers for the compliance posture this file must not
      regress: still a passive, static levels 1-18 reference table with the
      current level highlighted -- no imperative copy, no arrows, nothing
      about an opponent. Choosing which static dataset to view (the lane) is
      the user's own choice, not the app telling them what to do.
    -->
    <main id="cb-overlay" class="cb-overlay" aria-live="polite">
      <header id="cb-header" class="cb-header">
        <span id="cb-champion" class="cb-champion">CoachBuild</span>
        <span id="cb-interactive-badge" class="cb-interactive-badge" hidden>editable</span>
      </header>

      <div id="cb-lanebar" class="cb-lanebar" role="group" aria-label="Lane"></div>

      <div id="cb-body" class="cb-body">
        <p id="cb-message" class="cb-message"></p>
        <table id="cb-grid" class="cb-grid" hidden aria-label="Recommended skill order, levels 1 to 18"></table>
      </div>

      <footer id="cb-footer" class="cb-footer"></footer>
    </main>

    <script type="module" src="ingame.js"></script>
  </body>
</html>
