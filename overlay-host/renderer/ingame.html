<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoachBuild Overlay</title>
    <link rel="stylesheet" href="ingame.css" />
  </head>
  <body>
    <!--
      FULLSCREEN pivot (2026-07-27): this document now fills the whole
      screen (engy's window change) instead of a small 340x520 window
      pre-positioned by the OS -- everything below is absolutely positioned
      within a fully transparent viewport. See ingame.css's header for the
      "must never tint the game" constraint this implies.

      NEW: window.CoachBuildOverlay behaviour is unchanged as a public
      contract, but the DEFAULT on-screen presentation flipped -- the
      ability highlight box (#cb-highlight) is now the primary surface; the
      reference table (#cb-overlay) is kept, unchanged in content, but
      defaults OFF and only renders when engy's calibration push says to
      (see ingame.js). Choosing which static dataset to view (the lane) is
      still the user's own choice, not the app telling them what to do --
      that posture is unchanged for the table. The highlight box IS
      imperative by design now -- see ingame.js's header for why that
      reasoning is allowed to be different for this one surface.
    -->
    <div id="cb-highlight" class="cb-highlight" hidden></div>

    <main id="cb-overlay" class="cb-overlay" aria-live="polite" hidden>
      <header id="cb-header" class="cb-header">
        <span id="cb-champion" class="cb-champion">CoachBuild</span>
        <span id="cb-interactive-badge" class="cb-interactive-badge" hidden>editable</span>
      </header>

      <div id="cb-lanebar" class="cb-lanebar" role="group" aria-label="Lane"></div>

      <div id="cb-body" class="cb-body">
        <p id="cb-message" class="cb-message"></p>
        <table id="cb-grid" class="cb-grid" hidden aria-label="Recommended skill order, levels 1 to 18"></table>
      </div>

      <footer id="cb-footer" class="cb-footer"></footer>
    </main>

    <script type="module" src="ingame.js"></script>
  </body>
</html>
