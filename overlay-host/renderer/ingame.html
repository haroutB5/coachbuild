<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoachBuild Overlay</title>
    <link rel="stylesheet" href="ingame.css" />
  </head>
  <body>
    <!--
      FULLSCREEN pivot (2026-07-27): this document now fills the whole
      screen (engy's window change) instead of a small 340x520 window
      pre-positioned by the OS -- everything below is absolutely positioned
      within a fully transparent viewport. See ingame.css's header for the
      "must never tint the game" constraint this implies.

      NEW: window.CoachBuildOverlay behaviour is unchanged as a public
      contract, but the DEFAULT on-screen presentation flipped -- the
      ability highlight box (#cb-highlight) is now the primary surface; the
      reference table (#cb-overlay) is kept, unchanged in content, but
      defaults OFF and only renders when engy's calibration push says to
      (see ingame.js). Choosing which static dataset to view (the lane) is
      still the user's own choice, not the app telling them what to do --
      that posture is unchanged for the table. The highlight box IS
      imperative by design now -- see ingame.js's header for why that
      reasoning is allowed to be different for this one surface.
    -->
    <div id="cb-highlight" class="cb-highlight" hidden></div>

    <!--
      Adjust-in-place mode (round 8, 2026-07-27): the calibration WINDOW
      approach failed live -- on one monitor the user was aiming boxes at an
      ability bar the calibration window itself was covering. This replaces
      it: nudge the SAME four boxes, live, directly over the running game.
      main.js drives `hidden` here indirectly via
      window.coachbuildIPC.onAdjustModeChange (see ingame.js) -- this markup
      just provides the four boxes + the legend; all positioning is inline
      styles set by ingame.js from the locally-nudged working geometry.
      Not a Q/W/E/R-specific single recommendation like #cb-highlight -- all
      four render at once so the user aligns the whole row against the real
      HUD in one pass.
    -->
    <div id="cb-adjust" class="cb-adjust" hidden>
      <div class="cb-adjust-box" id="cb-adjust-box-Q"><span class="cb-adjust-box-label">Q</span></div>
      <div class="cb-adjust-box" id="cb-adjust-box-W"><span class="cb-adjust-box-label">W</span></div>
      <div class="cb-adjust-box" id="cb-adjust-box-E"><span class="cb-adjust-box-label">E</span></div>
      <div class="cb-adjust-box" id="cb-adjust-box-R"><span class="cb-adjust-box-label">R</span></div>
      <!-- Save/cancel goes FIRST and is emphasised. It used to sit last, under
           a line ending in the word "spacing" — a real user read that mid-game
           and pressed SPACE, which does nothing, and concluded their changes
           would not save. Nothing was wrong with the key handling; the line
           that mattered most was the least prominent one on a legend being
           read in a fraction of a second during a match. The adjust keys are
           discoverable by trying them; the SAVE key is not. -->
      <div id="cb-adjust-legend" class="cb-adjust-legend">
        <strong>Adjusting overlay position</strong>
        <div class="cb-adjust-legend-primary"><kbd>Enter</kbd> to SAVE &middot; <kbd>Esc</kbd> to cancel</div>
        <div><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> move &middot; +<kbd>Shift</kbd> = &times;10</div>
        <div><kbd>+</kbd>/<kbd>-</kbd> box size &middot; <kbd>[</kbd>/<kbd>]</kbd> gap between boxes</div>
      </div>
    </div>

    <main id="cb-overlay" class="cb-overlay" aria-live="polite" hidden>
      <header id="cb-header" class="cb-header">
        <span id="cb-champion" class="cb-champion">CoachBuild</span>
        <span id="cb-interactive-badge" class="cb-interactive-badge" hidden>editable</span>
      </header>

      <div id="cb-lanebar" class="cb-lanebar" role="group" aria-label="Lane"></div>

      <div id="cb-body" class="cb-body">
        <p id="cb-message" class="cb-message"></p>
        <table id="cb-grid" class="cb-grid" hidden aria-label="Recommended skill order, levels 1 to 18"></table>
      </div>

      <footer id="cb-footer" class="cb-footer"></footer>
    </main>

    <script type="module" src="ingame.js"></script>
  </body>
</html>
